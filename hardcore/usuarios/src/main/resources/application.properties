spring.application.name=usuarios
server.port=8080
spring.datasource.url=jdbc:postgresql://localhost:5432/usuarios_hardcore
spring.config.import=optional:file:.env[.properties],optional:file:usuarios/.env[.properties]
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true