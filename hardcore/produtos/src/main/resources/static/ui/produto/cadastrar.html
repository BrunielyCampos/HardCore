<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HARDCORE | Cadastrar produto</title><link rel="stylesheet" href="/ui/css/hardcore.css"></head><body data-page-title="Cadastrar produto" data-page-description="Cadastra um produto."><form id="api-form" data-method="POST" data-path="/produtos/cadastrar"><div class="fields">
<div class="field"><label>Nome do produto</label><input data-kind="body" data-key="nome" data-type="text" type="text" required></div>
<div class="field"><label>Preço</label><input data-kind="body" data-key="preco" data-type="number" type="number" step="0.01" min="0.01" required></div>
<div class="field"><label>Categoria</label><input data-kind="body" data-key="categoria" data-type="text" type="text" required></div>
<div class="field"><label>Marca</label><input data-kind="body" data-key="marca" data-type="text" type="text" required></div>
<div class="field"><label>ID da prateleira (opcional)</label><input data-kind="body" data-key="idPrateleira" data-type="number" type="number" min="1"></div>
</div><button class="btn" type="submit">Continuar</button></form><script src="/ui/js/hardcore.js"></script></body></html>
