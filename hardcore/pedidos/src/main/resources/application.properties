spring.application.name=pedidos
server.port=8083
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pedidos_hardcore}
spring.config.import=optional:file:.env[.properties],optional:file:pedidos/.env[.properties]
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
integracao.usuarios.url=${USUARIOS_URL:http://localhost:8080}
integracao.produtos.url=${PRODUTOS_URL:http://localhost:8082}
abacatepay.api.url=https://api.abacatepay.com/v2
abacatepay.api.key=${ABACATEPAY_API_KEY}
abacatepay.webhook.secret=${ABACATEPAY_WEBHOOK_SECRET}
abacatepay.webhook.endpoint=${ABACATEPAY_WEBHOOK_ENDPOINT}